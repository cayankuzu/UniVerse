name: eas-update-preview

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish preview, or validate and seal physical-device evidence for an existing preview."
        required: true
        default: publish
        type: choice
        options:
          - publish
          - attest-devices
      base_sha:
        description: "publish only: full SHA of the last approved preview update."
        required: false
        type: string
      release_message:
        description: "publish only: short operator-visible description of the existing-feature fix."
        required: false
        type: string
      preview_run_id:
        description: "attest-devices only: successful preview publish run ID for this exact SHA."
        required: false
        type: string
      binary_ota_evidence_path:
        description: "attest-devices only: committed published-binary OTA inspection JSON path."
        required: false
        type: string
      device_manifest_base64:
        description: "attest-devices only: base64 of the completed no-PII runtime-device manifest JSON."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: eas-update-preview-${{ inputs.mode }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-preview:
    name: Credential-free preview verification
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      classification: ${{ steps.ota_diff.outputs.classification }}
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      INPUT_RELEASE_MESSAGE: ${{ inputs.release_message }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate immutable source and release input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          node <<'NODE'
          const message = process.env.INPUT_RELEASE_MESSAGE || "";
          if (!message.trim() || message.length > 160 || /[\u0000-\u001f\u007f]/u.test(message)) {
            throw new Error("release_message must be 1-160 characters without control characters");
          }
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Self-test OTA policy and evidence tooling
        run: >-
          node --test
          ./utils/guards/classify-ota-diff.test.cjs
          ./utils/ops/validate-ota-provider.test.cjs
          ./utils/ops/validate-ota-device-evidence.test.cjs
          ./utils/ops/write-ota-update-evidence.test.cjs
          ./utils/ops/ota-workflow-policy.test.cjs

      - name: Classify immutable diff
        id: ota_diff
        shell: bash
        run: >-
          node ./utils/guards/classify-ota-diff.cjs
          --base "${BASE_SHA}"
          --head "${CANDIDATE_SHA}"
          --require-clean
          --require-ota-safe
          --require-ota-payload
          --json-output "${RUNNER_TEMP}/preview-classifier.json"
          --github-output "${GITHUB_OUTPUT}"

      - name: Run repository quality gates without provider credentials
        run: |
          npm run security:verify:internal
          npm run lint -- --max-warnings=0
          npm run format:check:all
          npm run test:ci

  publish-preview:
    name: Publish verified preview from a fresh checkout
    if: ${{ inputs.mode == 'publish' }}
    needs: verify-preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      EAS_CLI_VERSION: "23.0.0"
      EVIDENCE_DIR: ${{ runner.temp }}/universe-ota/preview/${{ github.sha }}
      INPUT_RELEASE_MESSAGE: ${{ inputs.release_message }}
      OTA_CHANNEL: preview
      OTA_ENVIRONMENT: preview
    steps:
      - name: Checkout immutable candidate into fresh publish workspace
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Validate fresh candidate identity and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          mkdir -p "${EVIDENCE_DIR}"
          node <<'NODE'
          const fs = require("node:fs");
          const message = process.env.INPUT_RELEASE_MESSAGE || "";
          if (!message.trim() || message.length > 160 || /[\u0000-\u001f\u007f]/u.test(message)) {
            throw new Error("release_message must be 1-160 characters without control characters");
          }
          const release = require("./config/app-release.json");
          fs.appendFileSync(process.env.GITHUB_ENV, `RUNTIME_VERSION=${release.runtimeVersion}\n`);
          NODE

      - name: Install locked dependencies in fresh publish workspace
        run: npm ci

      - name: Install pinned EAS CLI without provider credentials
        run: |
          npm install --global --ignore-scripts "eas-cli@${EAS_CLI_VERSION}"
          eas --version | grep -E '^eas-cli/23\.0\.0 '

      - name: Classify fresh immutable diff before provider access
        shell: bash
        run: >-
          node ./utils/guards/classify-ota-diff.cjs
          --base "${BASE_SHA}"
          --head "${CANDIDATE_SHA}"
          --require-clean
          --require-ota-safe
          --require-ota-payload
          --json-output "${EVIDENCE_DIR}/classifier.json"

      - name: Verify Expo identity
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami --non-interactive

      - name: Read provider state for idempotency
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas update:list
          --all
          --runtime-version "${RUNTIME_VERSION}"
          --limit 50
          --json
          --non-interactive
          >"${EVIDENCE_DIR}/preflight-update-list.json"

      - name: Reject duplicate candidate publication
        shell: bash
        run: >-
          node ./utils/ops/validate-ota-provider.cjs preflight
          --kind preview
          --candidate "${CANDIDATE_SHA}"
          --runtime-version "${RUNTIME_VERSION}"
          --branch "${OTA_CHANNEL}"
          --update-list "${EVIDENCE_DIR}/preflight-update-list.json"

      - name: Revalidate full cleanliness and OTA classification immediately before publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          node ./utils/guards/classify-ota-diff.cjs \
            --base "${BASE_SHA}" \
            --head "${CANDIDATE_SHA}" \
            --require-clean \
            --require-ota-safe \
            --require-ota-payload \
            --json-output "${EVIDENCE_DIR}/classifier.json"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Publish isolated preview update
        id: publish
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas update
          --channel "${OTA_CHANNEL}"
          --environment "${OTA_ENVIRONMENT}"
          --message "preview ${CANDIDATE_SHA}: ${INPUT_RELEASE_MESSAGE}"
          --platform all
          --rollout-percentage 100
          --clear-cache
          --emit-metadata
          --json
          --non-interactive
          >"${EVIDENCE_DIR}/eas-update.json"
          2>"${EVIDENCE_DIR}/eas-update.stderr.log"

      - name: Validate exact provider publish response
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/eas-update-metadata.json
          cp dist/eas-update-metadata.json "${EVIDENCE_DIR}/eas-update-metadata.json"
          node ./utils/ops/validate-ota-provider.cjs publish \
            --kind preview \
            --candidate "${CANDIDATE_SHA}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --branch "${OTA_CHANNEL}" \
            --message "preview ${CANDIDATE_SHA}: ${INPUT_RELEASE_MESSAGE}" \
            --provider-output "${EVIDENCE_DIR}/eas-update.json" \
            --update-metadata "${EVIDENCE_DIR}/eas-update-metadata.json" \
            --output "${EVIDENCE_DIR}/publish-validation.json"

      - name: Observe published update group
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas update:list
          --branch "${OTA_CHANNEL}"
          --runtime-version "${RUNTIME_VERSION}"
          --limit 10
          --json
          --non-interactive
          >"${EVIDENCE_DIR}/observed-update-list.json"

      - name: Observe preview channel linkage
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas channel:view "${OTA_CHANNEL}"
          --limit 10
          --json
          --non-interactive
          >"${EVIDENCE_DIR}/observed-channel.json"

      - name: Validate post-publish provider observation
        shell: bash
        run: |
          set -euo pipefail
          node ./utils/ops/validate-ota-provider.cjs observe \
            --kind preview \
            --candidate "${CANDIDATE_SHA}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --branch "${OTA_CHANNEL}" \
            --message "preview ${CANDIDATE_SHA}: ${INPUT_RELEASE_MESSAGE}" \
            --rollout-percentage 100 \
            --provider-output "${EVIDENCE_DIR}/eas-update.json" \
            --update-metadata "${EVIDENCE_DIR}/eas-update-metadata.json" \
            --update-list "${EVIDENCE_DIR}/observed-update-list.json" \
            --channel-view "${EVIDENCE_DIR}/observed-channel.json" \
            --output "${EVIDENCE_DIR}/provider-observation.json"

      - name: Write same-SHA preview evidence
        shell: bash
        run: |
          set -euo pipefail
          node ./utils/ops/write-ota-update-evidence.cjs \
            --kind preview \
            --base "${BASE_SHA}" \
            --head "${CANDIDATE_SHA}" \
            --channel "${OTA_CHANNEL}" \
            --environment "${OTA_ENVIRONMENT}" \
            --rollout-percentage 100 \
            --eas-cli-version "${EAS_CLI_VERSION}" \
            --classifier-report "${EVIDENCE_DIR}/classifier.json" \
            --provider-output "${EVIDENCE_DIR}/eas-update.json" \
            --provider-observation "${EVIDENCE_DIR}/provider-observation.json" \
            --provider-stderr "${EVIDENCE_DIR}/eas-update.stderr.log" \
            --update-metadata "${EVIDENCE_DIR}/eas-update-metadata.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${EVIDENCE_DIR}/manifest.json"

      - name: Upload immutable preview evidence
        if: ${{ always() && steps.publish.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eas-update-preview-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record truthful preview status
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "### EAS Update preview"
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Diff: \`${{ needs.verify-preview.outputs.classification }}\`"
            echo "- Target: \`${OTA_ENVIRONMENT}/${OTA_CHANNEL}\`"
            echo "- Android+iOS provider identity, branch/channel linkage, runtime, and 100% preview state were observed."
            echo "- Physical-device evidence is still required before production."
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Resolve published group for automatic preview rollback
        id: rollback_identity
        if: ${{ failure() && steps.publish.outcome == 'success' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = `${process.env.EVIDENCE_DIR}/eas-update.json`;
          if (!fs.existsSync(file)) process.exit(0);
          const updates = JSON.parse(fs.readFileSync(file, "utf8"));
          const groups = [...new Set(updates.map((item) => String(item?.group || "").toLowerCase()))];
          if (groups.length !== 1 || !/^[0-9a-f-]{36}$/u.test(groups[0])) process.exit(0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `group_id=${groups[0]}\n`);
          NODE

      - name: Roll back preview after a post-publish failure
        if: ${{ failure() && steps.rollback_identity.outputs.group_id != '' }}
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          eas update:rollback
          "${{ steps.rollback_identity.outputs.group_id }}"
          --message "automatic preview rollback after evidence failure ${CANDIDATE_SHA}"
          --platform all
          --json
          --non-interactive
          >"${EVIDENCE_DIR}/automatic-rollback.json"

  verify-device-attestation:
    name: Credential-free physical-device evidence verification
    if: ${{ inputs.mode == 'attest-devices' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINARY_OTA_EVIDENCE_PATH: ${{ inputs.binary_ota_evidence_path }}
      CANDIDATE_SHA: ${{ github.sha }}
      DEVICE_MANIFEST_BASE64: ${{ inputs.device_manifest_base64 }}
      EVIDENCE_DIR: ${{ runner.temp }}/universe-ota/device-verification/${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
    steps:
      - name: Checkout immutable candidate for credential-free verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate attestation inputs and runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          mkdir -p "${EVIDENCE_DIR}/preview-evidence"
          node <<'NODE'
          const fs = require("node:fs");
          if (!/^[1-9]\d*$/u.test(process.env.PREVIEW_RUN_ID || "")) throw new Error("invalid preview_run_id");
          if (!String(process.env.DEVICE_MANIFEST_BASE64 || "").trim()) throw new Error("device manifest is required");
          const requested = String(process.env.BINARY_OTA_EVIDENCE_PATH || "").replace(/\\/gu, "/");
          if (!/^release-evidence\/published-binaries\/[-_.a-z0-9]+\.json$/iu.test(requested)) {
            throw new Error("binary OTA evidence path is invalid");
          }
          const release = require("./config/app-release.json");
          fs.appendFileSync(process.env.GITHUB_ENV, `RUNTIME_VERSION=${release.runtimeVersion}\n`);
          NODE

      - name: Download exact preview evidence for verification
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIEW_RUN_ID}" >"${EVIDENCE_DIR}/preview-run.json"
          node - "${EVIDENCE_DIR}/preview-run.json" <<'NODE'
          const fs = require("node:fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (run.path !== ".github/workflows/eas-update-preview.yml") throw new Error("unexpected preview workflow");
          if (run.status !== "completed" || run.conclusion !== "success") throw new Error("preview run failed");
          if (run.head_sha !== process.env.CANDIDATE_SHA) throw new Error("preview run SHA mismatch");
          NODE
          gh run download "${PREVIEW_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "eas-update-preview-evidence-${CANDIDATE_SHA}" \
            --dir "${EVIDENCE_DIR}/preview-evidence"

      - name: Validate operator device manifest without credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${DEVICE_MANIFEST_BASE64}" | base64 --decode >"${EVIDENCE_DIR}/manifest.json"
          node - "${EVIDENCE_DIR}/manifest.json" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const file = process.argv[2];
          const raw = fs.readFileSync(file);
          fs.writeFileSync(`${file}.sha256`, `${crypto.createHash("sha256").update(raw).digest("hex")}  ${path.basename(file)}\n`);
          NODE
          node ./utils/ops/validate-ota-device-evidence.cjs \
            --candidate "${CANDIDATE_SHA}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --manifest "${EVIDENCE_DIR}/manifest.json" \
            --checksum "${EVIDENCE_DIR}/manifest.json.sha256" \
            --preview-manifest "${EVIDENCE_DIR}/preview-evidence/manifest.json" \
            --preview-checksum "${EVIDENCE_DIR}/preview-evidence/manifest.json.sha256" \
            --binary-evidence "${BINARY_OTA_EVIDENCE_PATH}" \
            --output "${EVIDENCE_DIR}/validation.json"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

  attest-devices:
    name: Seal verified Android/iOS evidence from a fresh checkout
    if: ${{ inputs.mode == 'attest-devices' }}
    needs: verify-device-attestation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      BINARY_OTA_EVIDENCE_PATH: ${{ inputs.binary_ota_evidence_path }}
      CANDIDATE_SHA: ${{ github.sha }}
      DEVICE_MANIFEST_BASE64: ${{ inputs.device_manifest_base64 }}
      EVIDENCE_DIR: ${{ runner.temp }}/universe-ota/device-attestation/${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
    steps:
      - name: Checkout immutable candidate into fresh attestation workspace
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare fresh attestation workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          mkdir -p "${EVIDENCE_DIR}/preview-evidence"
          node <<'NODE'
          const fs = require("node:fs");
          if (!/^[1-9]\d*$/u.test(process.env.PREVIEW_RUN_ID || "")) throw new Error("invalid preview_run_id");
          const release = require("./config/app-release.json");
          fs.appendFileSync(process.env.GITHUB_ENV, `RUNTIME_VERSION=${release.runtimeVersion}\n`);
          NODE

      - name: Re-download exact successful preview evidence
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIEW_RUN_ID}" >"${EVIDENCE_DIR}/preview-run.json"
          node - "${EVIDENCE_DIR}/preview-run.json" <<'NODE'
          const fs = require("node:fs");
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (run.path !== ".github/workflows/eas-update-preview.yml") throw new Error("unexpected preview workflow");
          if (run.status !== "completed" || run.conclusion !== "success") throw new Error("preview run failed");
          if (run.head_sha !== process.env.CANDIDATE_SHA) throw new Error("preview run SHA mismatch");
          NODE
          gh run download "${PREVIEW_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "eas-update-preview-evidence-${CANDIDATE_SHA}" \
            --dir "${EVIDENCE_DIR}/preview-evidence"

      - name: Revalidate operator device manifest in fresh workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${DEVICE_MANIFEST_BASE64}" | base64 --decode >"${EVIDENCE_DIR}/manifest.json"
          node - "${EVIDENCE_DIR}/manifest.json" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const file = process.argv[2];
          const raw = fs.readFileSync(file);
          fs.writeFileSync(`${file}.sha256`, `${crypto.createHash("sha256").update(raw).digest("hex")}  ${path.basename(file)}\n`);
          NODE
          node ./utils/ops/validate-ota-device-evidence.cjs \
            --candidate "${CANDIDATE_SHA}" \
            --runtime-version "${RUNTIME_VERSION}" \
            --manifest "${EVIDENCE_DIR}/manifest.json" \
            --checksum "${EVIDENCE_DIR}/manifest.json.sha256" \
            --preview-manifest "${EVIDENCE_DIR}/preview-evidence/manifest.json" \
            --preview-checksum "${EVIDENCE_DIR}/preview-evidence/manifest.json.sha256" \
            --binary-evidence "${BINARY_OTA_EVIDENCE_PATH}" \
            --output "${EVIDENCE_DIR}/validation.json"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Upload immutable physical-device evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eas-update-preview-device-evidence-${{ github.sha }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Record device attestation status
        shell: bash
        run: |
          {
            echo "### Preview physical-device evidence"
            echo "- Candidate/runtime: \`${CANDIDATE_SHA}/${RUNTIME_VERSION}\`"
            echo "- Android and iOS cold, warm, offline, update-applied, and critical-flow claims were validated."
            echo "- The immutable artifact is ready for the production OTA gate."
          } >>"${GITHUB_STEP_SUMMARY}"
