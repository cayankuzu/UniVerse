name: security-verify

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/release-*"
      - "release/**"
  workflow_dispatch:
    inputs:
      diff_base_sha:
        description: "Base commit SHA used for changed-line coverage."
        required: true
        type: string

permissions:
  contents: read

jobs:
  internal-verify:
    runs-on: ubuntu-latest
    env:
      DIFF_COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.diff_base_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:verify:internal
      - run: npm run lint
      - run: npm run format:check:all
      - run: npm run test:coverage
      - run: npm run guard:diff-coverage:self-test
      - run: npm run guard:diff-coverage

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks-action v2 aborts before scanning unless GITHUB_TOKEN is present.
      # Comments/artifacts stay off so the job keeps a read-only token.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      # The action only scans the event's commit range. Full history is the
      # gate that actually matters for a leaked-then-deleted secret, so it runs
      # here explicitly against the same .gitleaks.toml, on every event.
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3             -o "$RUNNER_TEMP/$archive"             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Full-history secret scan
        run: npm run security:secrets:history
      - name: Working-tree secret scan
        run: npm run security:secrets

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: auto
