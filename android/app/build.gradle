apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import java.util.Properties

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def requestedGradleTasks = gradle.startParameter.taskNames.collect { String.valueOf(it ?: "").toLowerCase() }
def releaseTasksRequested = requestedGradleTasks.any { taskName ->
    taskName.contains("release") ||
    taskName.contains("bundleproduction") ||
    taskName.contains("assembleproduction")
}
def productionEnvRequested = String.valueOf(System.getenv("EXPO_PUBLIC_APP_ENV") ?: "").trim() == "production"
def googleServicesCandidates = [
    project.file("google-services.json"),
    project.file("src/debug/google-services.json"),
    project.file("src/release/google-services.json"),
]
def hasGoogleServicesConfig = googleServicesCandidates.any { it.exists() }
if (hasGoogleServicesConfig) {
    apply plugin: "com.google.gms.google-services"
} else if (releaseTasksRequested || productionEnvRequested) {
    throw new GradleException("Android Google services config is required for production/release builds. Run npm run materialize:native-config or provide android/app/src/release/google-services.json via a file secret.")
} else {
    logger.lifecycle("[android] google-services.json bulunamadi; debug/dev build Firebase/FCM native config olmadan devam edecek.")
}
def enableSentryGradlePlugin = System.getenv("DISABLE_SENTRY_GRADLE_PLUGIN") != "true"
if (enableSentryGradlePlugin) {
    apply plugin: "io.sentry.android.gradle"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}
def dotEnvValues = new LinkedHashMap<String, String>()
[".env", ".env.local"].each { fileName ->
    def envFile = new File(projectRoot, fileName)
    if (!envFile.exists()) {
        return
    }
    envFile.eachLine("UTF-8") { line ->
        def trimmed = String.valueOf(line ?: "").trim()
        if (!trimmed || trimmed.startsWith("#")) {
            return
        }
        def separatorIndex = trimmed.indexOf("=")
        if (separatorIndex <= 0) {
            return
        }
        def key = trimmed.substring(0, separatorIndex).trim()
        def value = trimmed.substring(separatorIndex + 1).trim()
        if ((value.startsWith("\"") && value.endsWith("\"")) || (value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        dotEnvValues.put(key, value)
    }
}
def resolveBuildEnv = { String name ->
    return String.valueOf(
        System.getenv(name) ?:
        dotEnvValues.get(name) ?:
        ""
    ).trim()
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('hermes-compiler/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def easBuildGradle = new File(projectDir, "eas-build.gradle")
if (easBuildGradle.exists()) {
    apply from: new File(projectDir, "eas-build.gradle")
}

if (enableSentryGradlePlugin) {
    apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@sentry/react-native/package.json'))"].execute().text.trim(), "sentry.gradle")
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: true).toBoolean()
def releaseStoreFile =
    findProperty("android.releaseStoreFile") ?:
    keystoreProperties.getProperty("android.releaseStoreFile") ?:
    localProperties.getProperty("android.releaseStoreFile") ?:
    System.getenv("ANDROID_RELEASE_STORE_FILE")
def releaseStorePassword =
    findProperty("android.releaseStorePassword") ?:
    keystoreProperties.getProperty("android.releaseStorePassword") ?:
    localProperties.getProperty("android.releaseStorePassword") ?:
    System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
def releaseKeyAlias =
    findProperty("android.releaseKeyAlias") ?:
    keystoreProperties.getProperty("android.releaseKeyAlias") ?:
    localProperties.getProperty("android.releaseKeyAlias") ?:
    System.getenv("ANDROID_RELEASE_KEY_ALIAS")
def releaseKeyPassword =
    findProperty("android.releaseKeyPassword") ?:
    keystoreProperties.getProperty("android.releaseKeyPassword") ?:
    localProperties.getProperty("android.releaseKeyPassword") ?:
    System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
def hasManualReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    .every { value -> String.valueOf(value ?: "").trim() }
def configuredVersionCode =
    findProperty("android.versionCode") ?:
    localProperties.getProperty("android.versionCode") ?:
    System.getenv("ANDROID_VERSION_CODE") ?:
    "120"
def configuredVersionName =
    findProperty("android.versionName") ?:
    localProperties.getProperty("android.versionName") ?:
    System.getenv("ANDROID_VERSION_NAME") ?:
    "1.0.120"
def configuredApplicationId =
    findProperty("android.applicationId") ?:
    localProperties.getProperty("android.applicationId") ?:
    resolveBuildEnv("EXPO_PUBLIC_ANDROID_PACKAGE") ?:
    "com.ogrencisosyalagi.app"

def escapeBuildConfigString = { value ->
    return String.valueOf(value ?: "")
        .replace("\\", "\\\\")
        .replace("\"", "\\\"")
}

def configuredPlayIntegrityProjectNumber =
    findProperty("android.playIntegrityProjectNumber") ?:
    localProperties.getProperty("android.playIntegrityProjectNumber") ?:
    System.getenv("PLAY_INTEGRITY_GOOGLE_CLOUD_PROJECT_NUMBER") ?:
    System.getenv("EXPO_PUBLIC_PLAY_INTEGRITY_GOOGLE_CLOUD_PROJECT_NUMBER") ?:
    ""

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.ogrencisosyalagi.app'
    defaultConfig {
        applicationId String.valueOf(configuredApplicationId).trim()
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(String.valueOf(configuredVersionCode).trim())
        versionName String.valueOf(configuredVersionName).trim()

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        buildConfigField "String", "PLAY_INTEGRITY_PROJECT_NUMBER", "\"${escapeBuildConfigString(configuredPlayIntegrityProjectNumber)}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasManualReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix "-dev"
            resValue "string", "app_name", "UniVerse"
            signingConfig signingConfigs.debug
        }
        release {
            if (hasManualReleaseSigning) {
                signingConfig signingConfigs.release
            }
            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'true'
            shrinkResources enableShrinkResources.toBoolean()
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

afterEvaluate {
    if (releaseTasksRequested && !easBuildGradle.exists() && !hasManualReleaseSigning) {
        throw new GradleException("Release signing is not configured. Use EAS credentials or set android.releaseStoreFile/android.releaseStorePassword/android.releaseKeyAlias/android.releaseKeyPassword.")
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.vanniktech:android-image-cropper:4.7.0")
    def media3Version = "1.8.0"
    implementation("androidx.media3:media3-common:$media3Version")
    implementation("androidx.media3:media3-effect:$media3Version")
    implementation("androidx.media3:media3-transformer:$media3Version")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
    implementation("com.google.android.play:integrity:1.4.0")
}

if (enableSentryGradlePlugin) {
    sentry {
        ignoredBuildTypes = ["debug"]
        autoUploadProguardMapping = shouldSentryAutoUpload()
        includeProguardMapping = true
        dexguardEnabled = false
        uploadNativeSymbols = shouldSentryAutoUpload()
        autoUploadNativeSymbols = shouldSentryAutoUpload()
        includeNativeSources = true
        includeSourceContext = false
        tracingInstrumentation {
            enabled = false
        }
        autoInstallation {
            enabled = false
        }
    }
}
